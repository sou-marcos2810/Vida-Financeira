name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone do app
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b0b0c' --iconBackgroundColorDark '#0b0b0c'

      - name: Sincronizar arquivos do app
        run: npx cap sync android

      - name: Usar chave fixa de assinatura
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: VidaFinanceira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VidaFinanceira.apk
          gh release create "v${{ github.run_number }}" VidaFinanceira.apk --title "Vida Financeira v${{ github.run_number }}" --notes "APK pronto para instalar no Android."
